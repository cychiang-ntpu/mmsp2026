name: build-run-artifacts

on:
  push:
  workflow_dispatch:

jobs:
  build_run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make python3 python3-pip curl

      - name: Build
        run: |
          make signal_gen spectrogram

      - name: Run all
        run: |
          bash scripts/run_all.sh

      - name: Upload artifacts (wav/txt/pdf)
        uses: actions/upload-artifact@v4
        with:
          name: mini-project-5-outputs
          path: |
            out/wav/*.wav
            out/txt/*.txt
            out/pdf/*.pdf
