<text x="90" y="60" fill="#555">段 0 的 16 階每階寬 2；段 7 的每階寬 128 → 階距隨振幅加倍，等於「相對誤差固定」</text>
<text x="90" y="78" fill="#555">一個 byte = 符號 1 bit ＋ 段號 3 bits ＋ 段內 4 bits；查表就能編解碼</text>
<text x="340.0" y="412" text-anchor="middle" fill="#555">（正半邊；負半邊對稱，由符號 bit 區分）</text>
